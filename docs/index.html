<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Istiqamah</title>
  <meta name="description" content="The adhan on your laptop and a daily evaluation chart for solat, sunnah, Quran, salawat and dhikr.">
  <meta name="theme-color" content="#0f4d45">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/favicon.png" alt="" width="28" height="28"><span>Istiqamah</span></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-act="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-act="tab" data-tab="progress" aria-selected="false">Progress</button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="btn-share" data-act="share" aria-label="Share Istiqamah" title="Share" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" data-act="settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="view-today">
    <div id="banner"></div>
    <section id="hero" class="card hero" aria-live="polite"></section>
    <div id="daynav" class="daynav"></div>
    <section id="solat" class="card"></section>
    <div class="grid2">
      <section id="quran" class="card"></section>
      <section id="extras" class="card"></section>
    </div>
    <section id="dhikr" class="card"></section>
    <section id="note-card" class="card">
      <div class="card-head"><h2>Muhasabah</h2><span class="sub" id="note-day"></span></div>
      <label class="visually-hidden" for="note-text">Reflection for this day</label>
      <textarea id="note-text" rows="3" placeholder="What went well today? One thing to do better tomorrow…"></textarea>
    </section>
    <p class="foot">Made to be shared. Your chart stays on your own device.</p>
  </main>

  <main id="view-progress" hidden>
    <section id="progress-head" class="card"></section>
    <section id="chart" class="card chart-card"></section>
    <section id="history" class="card"></section>
  </main>

  <div id="overlay" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="settings" aria-label="Settings"></dialog>

  <script src="prayertimes.js"></script>
  <script src="app.js"></script>
</body>
</html>
